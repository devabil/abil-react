    <script>
      // Load typography preview fonts only on private routes that need them.
      (function () {
        var HREF = "https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@400;700&family=Allura&family=Bebas+Neue&family=Cormorant+Garamond:wght@400;600&family=Pacifico&family=Space+Grotesk:wght@400;600&family=Manrope:wght@400;600&family=Fredoka:wght@500;600&family=Press+Start+2P&family=Orbitron:wght@500;700&display=swap";
        var PREVIEW_ROUTES = ["/briefing", "/dashboard", "/login"];
        var loaded = false;
        function loadPreviewFonts() {
          if (loaded) return;
          loaded = true;
          var l = document.createElement("link");
          l.rel = "stylesheet";
          l.href = HREF;
          document.head.appendChild(l);
        }
        function checkRoute() {
          var p = location.pathname;
          for (var i = 0; i < PREVIEW_ROUTES.length; i++) {
            if (p === PREVIEW_ROUTES[i] || p.indexOf(PREVIEW_ROUTES[i] + "/") === 0) { loadPreviewFonts(); return; }
          }
        }
        window.__abilLoadTypePreviewFonts = loadPreviewFonts;
        ["pushState", "replaceState"].forEach(function (m) {
          var orig = history[m];
          history[m] = function () { var r = orig.apply(this, arguments); try { checkRoute(); } catch (e) { /* */ } return r; };
        });
        window.addEventListener("popstate", checkRoute);
        checkRoute();
      })();
    </script>
